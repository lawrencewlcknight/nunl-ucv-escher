[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hunl-ucv-escher"
version = "0.6.0"
description = "UCV-ESCHER research baseline for heads-up no-limit Hold'em"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4", "open_spiel==1.6.3", "scipy==1.13.1", "torch==2.7.0",
]

[project.optional-dependencies]
api = ["certifi>=2024.7.4"]
parallel = ["ray==2.51.2", "psutil==7.2.1"]
dev = ["pytest>=8,<9"]

[project.scripts]
hunl-train = "hunl_escher.train:main"
hunl-play = "hunl_escher.play:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hunl_escher*", "unbiased_escher*", "adaptive_escher*", "vr_deep_cfr*"]

[tool.setuptools.package-data]
hunl_escher = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ray: real local Ray actors (opt-in via RUN_RAY_TESTS=1)"]
